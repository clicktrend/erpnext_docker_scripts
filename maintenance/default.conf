# Maintenance page server: answers EVERY request with 503 + the maintenance page.
# 503 (not 200) so browsers/bots/monitoring never mistake downtime for content,
# and nothing gets cached. Traefik serves this either via the low-priority
# fallback router (ERPNext frontend container gone) or via the errors
# middleware (frontend up, backend answering 502-504).
server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;

    add_header Cache-Control "no-store" always;
    add_header Retry-After "30" always;

    error_page 503 /index.html;
    location = /index.html { internal; }
    location / { return 503; }
}
